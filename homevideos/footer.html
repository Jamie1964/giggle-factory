    <!-- PAGE VIEW COUNTER -->
    <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 10px;">
      Views: <span id="page-view-count">...</span>
    </p>

    <script>
      (function updatePageViews() {
        const pageKey = 'counter_' + encodeURIComponent(window.location.host + window.location.pathname);
        let views = localStorage.getItem(pageKey);
        
        if (!views) {
          views = 1250; // Starting baseline count
        } else {
          views = parseInt(views, 10) + 1;
        }
        
        localStorage.setItem(pageKey, views);
        document.getElementById('page-view-count').textContent = views;
      })();
    </script>
